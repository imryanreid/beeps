<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Five bars at irregular heights — a waveform, not a level meter. The
       unevenness is the point: a smooth decay reads as a meter, and real audio
       is not monotonic. Shares the family plate: #131210, rx 7, a 6-unit inset.
       Keep in step with the `sound` figure in the shared ToolMark. -->
  <rect width="32" height="32" rx="7" fill="#131210" />
  <rect x="6.00" y="11.50" width="2.80" height="9.00" rx="1.1" fill="#8db0ff" />
  <rect x="10.30" y="6.00" width="2.80" height="20.00" rx="1.1" fill="#8db0ff" />
  <rect x="14.60" y="10.00" width="2.80" height="12.00" rx="1.1" fill="#8db0ff" />
  <rect x="18.90" y="7.50" width="2.80" height="17.00" rx="1.1" fill="#8db0ff" />
  <rect x="23.20" y="12.50" width="2.80" height="7.00" rx="1.1" fill="#8db0ff" />
</svg>
