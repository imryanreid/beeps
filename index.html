<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Beeps · UI sounds your agent can actually specify</title>
    <meta
      name="description"
      content="Generate a coherent set of interface sounds — tap, toggle, success, error, notification and more — synthesized in the browser with Web Audio. No sample library, no hosted audio, no licensing. Exports as WAV, an inline data URI, a zero-dependency synthesis function, JSON, or markdown that tells a coding agent when to play what."
    />
    <link rel="canonical" href="https://www.beeps.studio/" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Ryan Reid" />
    <meta name="theme-color" content="#fdfdfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)" />

    <!--
      Raster first, SVG second: browsers that understand `type` take the SVG
      and scale it perfectly, while everything else falls back to the PNG.
      The PNG is not redundant — Google Search's favicon docs list neither SVG
      among the supported formats nor anything at or below 48x48 as advisable,
      and the SVG declares an intrinsic 32x32. Without a raster fallback a
      search result gets the generic globe.
      All three are generated from one shape by scripts/build-icons.py.
    -->
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Social unfurls. og:site_name is the brand; og:title matches <title>. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Beeps" />
    <meta property="og:url" content="https://www.beeps.studio/" />
    <meta property="og:title" content="Beeps · UI sounds your agent can actually specify" />
    <meta
      property="og:description"
      content="A coherent set of interface sounds — tap, toggle, open, close, send, receive, success, error, notification, delete — synthesized in the browser with Web Audio. No sample library, no hosted audio, no licensing. Exports as WAV, a data URI, a zero-dependency synthesis function, JSON, or markdown that tells a coding agent when to play what."
    />
    <!--
      No og:image yet. An unfurl with a broken image is worse than one with
      none: the card renders a grey box where the design should be. It lands
      when the card itself does.
    -->
    <meta name="twitter:card" content="summary" />

    <!--
      Machine-readable, and deliberately specific about the part that matters:
      this tool is meant to be handed to a coding agent, so the description
      says what it exports and llms.txt documents the URL API.

      It does NOT claim a no-JavaScript fetch returns the set, because it does
      not — this is a client-rendered page and the served HTML is the shell.
      Ramps can make that claim because it has the middleware and /api to back
      it; those are still to build here. See NEXT-UP.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Beeps",
        "url": "https://www.beeps.studio/",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any (web browser)",
        "description": "Built to be handed to a coding agent: /llms.txt documents every parameter and every sound, and the page renders the complete set as plain text in the DOM. Generates a coherent set of eleven interface sounds — tap, toggle on and off, open, close, send, receive, success, error, notification and delete — synthesized in the browser with Web Audio rather than sampled, so there is no audio to host and nothing to license. Every sound is derived from one base frequency, paired sounds invert by construction, and loudness is normalized across the set. Exports to WAV, an inline data URI, a zero-dependency synthesis function, JSON, or markdown that tells an agent when each sound should and should not play.",
        "isAccessibleForFree": true,
        "isPartOf": {
          "@type": "WebSite",
          "name": "Studio Tools",
          "description": "Small, free, agent-readable design utilities."
        },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": {
          "@type": "Person",
          "name": "Ryan Reid",
          "url": "https://www.linkedin.com/in/imryanreid/"
        },
        "featureList": [
          "Eleven interface sounds covering the events a product actually has",
          "Synthesized in the browser with Web Audio — no sample library, no hosted audio, no licensing",
          "Nine character presets, from a near-sine default to FM bells, chiptune and zaps",
          "Every frequency derived from one base, so editing one sound keeps the set in tune",
          "Paired sounds invert by construction — open/close, send/receive, toggle on/off",
          "A per-sound voice picker, so one sound can use a different preset from the rest",
          "Loudness normalized across the set by A-weighted RMS, so no sound jumps out",
          "A duration budget with both a ceiling and a floor, since a sound under ~70 ms is heard as quieter rather than subtler",
          "Export to WAV, an inline data URI, a zero-dependency synthesis function, JSON, or agent-readable markdown",
          "Shareable permalinks that encode the whole set in the URL"
        ]
      }
    </script>

    <script>
      // Set the theme before first paint so a dark-mode visitor never sees a
      // white flash. Mirrors getInitialTheme() in src/shared/theme.ts — kept
      // inline deliberately: a module import would run after paint, which is
      // the whole thing this avoids.
      try {
        const stored = localStorage.getItem("theme")
        const dark =
          stored === "dark" ||
          (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches)
        if (dark) document.documentElement.classList.add("dark")
      } catch {
        /* Private mode can throw on localStorage. Light is a fine fallback. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
